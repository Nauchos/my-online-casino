
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Online Casino - Slots</title>
    <style>
        body { background-color: #1a1a1a; color: #ffffff; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .casino-title { color: #ffcc00; font-size: 28px; text-shadow: 2px 2px #000; }
        .slot-machine { background: #333; border: 4px solid #ffcc00; border-radius: 10px; display: inline-block; padding: 20px; margin-top: 20px; box-shadow: 0px 0px 20px #ffcc00; }
        .reel-container { display: flex; justify-content: center; background: #000; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        .reel { font-size: 50px; width: 80px; height: 80px; line-height: 80px; background: #fff; margin: 5px; border-radius: 5px; border: 2px solid #888; }
        .balance-box { font-size: 20px; margin: 15px 0; color: #55ff55; }
        .spin-btn { background: #ffcc00; color: #000; font-size: 22px; font-weight: bold; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; box-shadow: 0px 4px #b38f00; }
        .spin-btn:active { box-shadow: 0px 1px #b38f00; transform: translateY(3px); }
        .message { font-size: 18px; margin-top: 15px; min-height: 24px; color: #ff5555; }
        .ad-placeholder { margin-top: 30px; padding: 15px; background: #2a2a2a; border: 1px dashed #777; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>
    <h1 class="casino-title">🎰 JACKPOT SLOTS 🎰</h1>
    <div class="balance-box">Credits: \$<span id="balance">100</span></div>
    <div class="slot-machine">
        <div class="reel-container">
            <div id="reel1" class="reel">🍒</div>
            <div id="reel2" class="reel">🍋</div>
            <div id="reel3" class="reel">🍊</div>
        </div>
        <button class="spin-btn" onclick="spinReels()">SPIN (\$5)</button>
    </div>
    <div id="status-msg" class="message"></div>
    <div class="ad-placeholder">
        <p>💰 Rewarded Ad System Ready 💰</p>
        <small>Ad placement container mapped for monetization setup.</small>
    </div>
    <script>
        let balance = 100;
        const symbols = ['🍒', '🍋', '🍊', '🍇', '🔔', '💎', '7️⃣'];
        const spinCost = 5;
        function spinReels() {
            if (balance < spinCost) {
                document.getElementById('status-msg').innerText = "Out of credits! Watch an ad to reload.";
                document.getElementById('status-msg').style.color = "#ff5555";
                return;
            }
            balance -= spinCost;
            document.getElementById('balance').innerText = balance;
            document.getElementById('status-msg').innerText = "Spinning...";
            document.getElementById('status-msg').style.color = "#ffffff";
            const res1 = symbols[Math.floor(Math.random() * symbols.length)];
            const res2 = symbols[Math.floor(Math.random() * symbols.length)];
            const res3 = symbols[Math.floor(Math.random() * symbols.length)];
            document.getElementById('reel1').innerText = res1;
            document.getElementById('reel2').innerText = res2;
            document.getElementById('reel3').innerText = res3;
            if (res1 === res2 && res2 === res3) {
                let winAmount = 50;
                if (res1 === '💎') winAmount = 100;
                if (res1 === '7️⃣') winAmount = 250;
                balance += winAmount;
                document.getElementById('balance').innerText = balance;
                document.getElementById('status-msg').innerText = `🎉 BIG WIN! You won $${winAmount}! 🎉`;
                document.getElementById('status-msg').style.color = "#55ff55";
            } else if (res1 === res2 || res2 === res3 || res1 === res3) {
                balance += 10;
                document.getElementById('balance').innerText = balance;
                document.getElementById('status-msg').innerText = "Match 2! You won \$10!";
                document.getElementById('status-msg').style.color = "#aaffaa";
            } else {
                document.getElementById('status-msg').innerText = "Try again!";
                document.getElementById('status-msg').style.color = "#ffaaaa";
            }
        }
    </script>
</body>
</html>
